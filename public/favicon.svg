<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Quantum Glow Filter -->
    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="forgeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30" />
      <stop offset="60%" stop-color="#FF5E1E" />
      <stop offset="100%" stop-color="#D94000" />
    </linearGradient>

    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="precisionBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="carrierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <linearGradient id="dieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182234" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>

    <radialGradient id="dieAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5E1E" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Ambient Chip Glow -->
  <rect x="64" y="64" width="384" height="384" rx="72" fill="#FF5E1E" opacity="0.25" filter="url(#chipGlow)" />

  <!-- 2. IC Package External Gold Lead Pins (Top, Bottom, Left, Right) -->
  <!-- Left Pins -->
  <g fill="url(#amberGold)">
    <rect x="22" y="130" width="46" height="22" rx="5" />
    <rect x="22" y="185" width="46" height="22" rx="5" />
    <rect x="22" y="245" width="46" height="22" rx="5" />
    <rect x="22" y="305" width="46" height="22" rx="5" />
    <rect x="22" y="360" width="46" height="22" rx="5" />

    <!-- Right Pins -->
    <rect x="444" y="130" width="46" height="22" rx="5" />
    <rect x="444" y="185" width="46" height="22" rx="5" />
    <rect x="444" y="245" width="46" height="22" rx="5" />
    <rect x="444" y="305" width="46" height="22" rx="5" />
    <rect x="444" y="360" width="46" height="22" rx="5" />

    <!-- Top Pins -->
    <rect x="130" y="22" width="22" height="46" rx="5" />
    <rect x="185" y="22" width="22" height="46" rx="5" />
    <rect x="245" y="22" width="22" height="46" rx="5" />
    <rect x="305" y="22" width="22" height="46" rx="5" />
    <rect x="360" y="22" width="22" height="46" rx="5" />

    <!-- Bottom Pins -->
    <rect x="130" y="444" width="22" height="46" rx="5" />
    <rect x="185" y="444" width="22" height="46" rx="5" />
    <rect x="245" y="444" width="22" height="46" rx="5" />
    <rect x="305" y="444" width="22" height="46" rx="5" />
    <rect x="360" y="444" width="22" height="46" rx="5" />
  </g>

  <!-- 3. IC Package Ceramic/Silicon Carrier Body -->
  <rect x="62" y="62" width="388" height="388" rx="68" fill="url(#carrierBg)" stroke="url(#forgeOrange)" stroke-width="6" />

  <!-- Inner Metallic Chamfer -->
  <rect x="74" y="74" width="364" height="364" rx="56" fill="none" stroke="url(#amberGold)" stroke-width="2.5" opacity="0.6" />

  <!-- 4. Central Silicon Die Substrate -->
  <rect x="122" y="122" width="268" height="268" rx="36" fill="url(#dieBg)" stroke="url(#forgeOrange)" stroke-width="3" />
  <rect x="122" y="122" width="268" height="268" rx="36" fill="url(#dieAura)" />

  <!-- Corner Bond Wire Leads (Package to Die) -->
  <g stroke="url(#amberGold)" stroke-width="2.5" opacity="0.75" stroke-linecap="round">
    <line x1="90" y1="90" x2="128" y2="128" />
    <line x1="422" y1="90" x2="384" y2="128" />
    <line x1="90" y1="422" x2="128" y2="384" />
    <line x1="422" y1="422" x2="384" y2="384" />
  </g>

  <!-- Silicon Micro-Interconnect Bus Grid -->
  <g stroke="#FF5E1E" stroke-width="1.2" opacity="0.18">
    <line x1="160" y1="130" x2="160" y2="382" />
    <line x1="200" y1="130" x2="200" y2="382" />
    <line x1="312" y1="130" x2="312" y2="382" />
    <line x1="352" y1="130" x2="352" y2="382" />

    <line x1="130" y1="160" x2="382" y2="160" />
    <line x1="130" y1="200" x2="382" y2="200" />
    <line x1="130" y1="312" x2="382" y2="312" />
    <line x1="130" y1="352" x2="382" y2="352" />
  </g>

  <!-- Corner Fiducial Alignment Crosshairs -->
  <g stroke="url(#precisionBlue)" stroke-width="2" opacity="0.85">
    <!-- Top-Left -->
    <line x1="134" y1="142" x2="150" y2="142" />
    <line x1="142" y1="134" x2="142" y2="150" />
    <!-- Top-Right -->
    <line x1="362" y1="142" x2="378" y2="142" />
    <line x1="370" y1="134" x2="370" y2="150" />
    <!-- Bottom-Left -->
    <line x1="134" y1="370" x2="150" y2="370" />
    <line x1="142" y1="362" x2="142" y2="378" />
    <!-- Bottom-Right -->
    <line x1="362" y1="370" x2="378" y2="370" />
    <line x1="370" y1="362" x2="370" y2="378" />
  </g>

  <!-- 5. ICONIC MONOGRAM "P" (Purushotham Silicon Architecture) -->
  <g filter="url(#coreGlow)">
    <!-- Vertical Backbone Spine -->
    <rect x="182" y="165" width="36" height="182" rx="9" fill="url(#forgeOrange)" />

    <!-- Upper Loop Geometric Structure (Chamfered P Head) -->
    <path d="M 210 165
             L 295 165
             L 332 202
             L 332 238
             L 295 275
             L 210 275
             Z"
          fill="url(#forgeOrange)" />

    <!-- P Loop Inner Die Cutout -->
    <path d="M 224 195
             L 280 195
             L 302 217
             L 302 223
             L 280 245
             L 224 245
             Z"
          fill="#0B101D"
          stroke="url(#amberGold)"
          stroke-width="2.5" />

    <!-- Dynamic 45° Data Ray / Chevron in Precision Blue -->
    <path d="M 235 275
             L 305 347
             L 268 347
             L 208 287
             Z"
          fill="url(#precisionBlue)" />

    <!-- Radiant Central Core Quantum Node -->
    <circle cx="256" cy="256" r="14" fill="#FFFFFF" opacity="0.95" />
    <circle cx="256" cy="256" r="8" fill="url(#forgeOrange)" />
    <circle cx="256" cy="256" r="3.5" fill="#FFFFFF" />
  </g>
</svg>

